[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = ["crates/agsync-core"]
resolver = "3"

[package]
name = "agsync"
version.workspace = true
edition.workspace = true
description = "Sync MCP servers and skills from a git config repo into coding agents"
license.workspace = true

[dependencies]
agsync-core = { path = "crates/agsync-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
rpassword = "7.5.5"

[dev-dependencies]
jsonc-parser = { version = "0.34.0", default-features = false, features = ["cst", "serde_json"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
toml_edit = "0.25.19"

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
