[package]
name = "agsync-core"
version.workspace = true
edition.workspace = true
description = "agsync core: plans and applies a config repo to coding agents, without a terminal"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
jsonc-parser = { version = "0.34.0", default-features = false, features = ["cst", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
toml_edit = "0.25.19"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation_Collections", "UI_Notifications"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Wdk_System_Threading"] }
