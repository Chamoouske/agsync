name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/main.rs"
      - ".github/workflows/docs.yml"
  push:
    branches: [stage, master]
    paths:
      - "docs/**"
      - "src/main.rs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2.8.0

      - name: Build agsync for the CLI help
        run: cargo build --locked

      - name: Check that the generated CLI help is up to date
        run: |
          docs/gen-cli-help.sh target/debug/agsync
          if ! git diff --exit-code -- docs/src/referencia/cli-help.md; then
            echo "::error::docs/src/referencia/cli-help.md is out of date; run docs/gen-cli-help.sh and commit it"
            exit 1
          fi

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build docs

      - name: Check the internal links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --include-fragments --root-dir ${{ github.workspace }}/docs/book 'docs/book/**/*.html'
          fail: true

      - name: Upload the book for GitHub Pages
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/book

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
