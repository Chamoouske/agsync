name: release

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "LICENSE*"
      - "packaging/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GIT_CLIFF_VERSION: 2.14.2

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Check out the repository with every tag
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute the next version from Conventional Commits
        id: next
        run: echo "version=$(scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: [ci, version]
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: agsync.exe
            asset: agsync-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: agsync
            asset: agsync-x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Set the version in Cargo.toml and Cargo.lock
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"agsync\"/{n;s/^version = .*/version = \"$VERSION\"/}" Cargo.lock

      - name: Install the stable Rust toolchain for the target
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Install musl tools for the static Linux build
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the binary after its target
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload the binary for the publish job
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository with every tag
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Write the release notes with git-cliff
        run: |
          git tag --force "v$VERSION"
          pipx run "git-cliff==$GIT_CLIFF_VERSION" --latest --strip all --output RELEASE_NOTES.md

      - name: Download every binary
        uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum agsync-* > SHA256SUMS

      - name: Tag the commit and publish the GitHub release as latest
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: |
            dist/agsync-x86_64-pc-windows-msvc.exe
            dist/agsync-x86_64-unknown-linux-musl
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md

      - name: Check that the latest release is this version
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" != "v$VERSION" ]; then
            echo "::error::latest release is $latest, expected v$VERSION"
            exit 1
          fi

  manifests:
    name: manifests
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository with every tag
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download SHA256SUMS from the published release
        run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist

      - name: Point the Scoop and WinGet manifests at this version
        run: scripts/update-manifests.sh "$VERSION" dist/SHA256SUMS

      - name: Add this version to CHANGELOG.md with git-cliff
        run: |
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md already has $VERSION"
          else
            pipx run "git-cliff==$GIT_CLIFF_VERSION" --latest --prepend CHANGELOG.md
          fi

      - name: Check the manifests against SHA256SUMS
        run: scripts/check-manifests.sh dist/SHA256SUMS

      - name: Check the manifests against the published asset
        run: scripts/check-manifests.sh --remote

      - name: Validate the manifests against the Scoop and WinGet schemas
        env:
          CHECK_JSONSCHEMA: pipx run check-jsonschema==0.33.0
        run: scripts/validate-manifest-schemas.sh

      - name: Attach the Scoop manifest to the release
        run: gh release upload "v$VERSION" packaging/scoop/agsync.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep the WinGet manifests for the winget job
        uses: actions/upload-artifact@v4.6.2
        with:
          name: winget-manifests
          path: packaging/winget
          if-no-files-found: error

      - name: Open a pull request with the changelog and manifests and turn on auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
        run: |
          branch="release/manifests-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CHANGELOG.md packaging
          if git diff --cached --quiet; then
            echo "changelog and manifests already have v$VERSION"
            exit 0
          fi
          git commit -m "chore(release): changelog and manifests for v$VERSION"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          if gh pr view "$branch" > /dev/null 2>&1; then
            echo "pull request for $branch already open"
          elif ! gh pr create --base master --head "$branch" \
            --title "chore(release): changelog and manifests for v$VERSION" \
            --body "CHANGELOG.md section for release v$VERSION, generated by git-cliff, and the Scoop and WinGet manifests, generated from the published SHA256SUMS."; then
            echo "::warning::could not open the pull request; open it from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/master...$branch"
            exit 0
          fi
          if ! gh pr merge "$branch" --auto --squash --delete-branch; then
            echo "::warning::could not enable auto-merge on the manifests pull request for v$VERSION; turn on Settings > General > Allow auto-merge or merge it by hand"
          fi

      - name: Report that the release is out but the manifests are not
        if: failure()
        run: echo "::error::release v$VERSION is published, but the Scoop and WinGet manifests were not updated. Fix the failing step and use Re-run failed jobs; the release is not rolled back."

  winget:
    name: winget
    needs: [version, manifests]
    if: vars.WINGET_SUBMIT == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the WinGet manifests
        uses: actions/download-artifact@v4.3.0
        with:
          name: winget-manifests
          path: winget

      - name: Submit the manifests to microsoft/winget-pkgs
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            echo "::warning::WINGET_TOKEN is not set; v$env:VERSION was not submitted to microsoft/winget-pkgs. Submit packaging/winget by hand with wingetcreate submit."
            exit 0
          }
          gh api "repos/microsoft/winget-pkgs/contents/manifests/c/Chamoouske/agsync/$env:VERSION" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            echo "Chamoouske.agsync $env:VERSION is already in microsoft/winget-pkgs"
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --no-open --prtitle "New version: Chamoouske.agsync version $env:VERSION" --token $env:WINGET_TOKEN winget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report that the release is out but WinGet was not updated
        if: failure()
        shell: pwsh
        run: echo "::error::release v$env:VERSION is published, but its manifests were not submitted to microsoft/winget-pkgs. Fix the failing step and use Re-run failed jobs; the release is not rolled back."
