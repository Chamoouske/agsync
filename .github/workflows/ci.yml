name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Install the stable Rust toolchain with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2.8.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy with warnings as errors
        run: cargo clippy --all-targets -- -D warnings

      - name: Run every test
        run: cargo test --no-fail-fast

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Lint the workflows
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint

      - name: Test the manifest update and check scripts
        run: scripts/test-manifests.sh

      - name: Test the pull request merge script
        run: scripts/test-merge-pr.sh

      - name: Test the Conventional Commits check
        run: scripts/test-check-conventional.sh

      - name: Check that the manifests match the published asset
        run: scripts/check-manifests.sh --remote

      - name: Validate the manifests against the Scoop and WinGet schemas
        env:
          CHECK_JSONSCHEMA: pipx run check-jsonschema==0.33.0
        run: scripts/validate-manifest-schemas.sh

  conventional-commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request with its history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the pull request title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "$PR_TITLE"
            git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA"
          } | scripts/check-conventional.sh
